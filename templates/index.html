<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 24px 16px;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Inter', sans-serif;
            color: #203a43;
        }

        .converter-card {
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            border: none;
            border-top: 6px solid #ff7e5f;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.97);
        }

        h2 {
            font-size: 1.7rem;
            font-weight: 700;
        }

        .form-label {
            font-weight: 700;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #ff7e5f;
            box-shadow: 0 0 0 0.2rem rgba(255, 126, 95, 0.25);
        }

        .btn-primary {
            background-color: #ff7e5f;
            border-color: #ff7e5f;
            border-radius: 10px;
            font-weight: 700;
        }

        .btn-primary:hover,
        .btn-primary:focus-visible,
        .btn-primary:active {
            background-color: #eb5e3d !important;
            border-color: #eb5e3d !important;
        }

        .currency-arrow {
            color: #eb5e3d;
            font-size: 1.4rem;
        }

        .result-box {
            padding: 1rem;
            border-radius: 10px;
            background-color: #eaf2f4;
            color: #2c5364;
            font-size: 1.5rem;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        @media (max-width: 480px) {
            .converter-card {
                padding: 1.25rem;
            }

            h2 {
                font-size: 1.4rem;
            }

            .result-box {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center">

    <div class="card shadow-lg converter-card">
        <h2 class="text-center mb-4">💱 Conversor de Divisas</h2>

        <form method="post">
            <div class="mb-3">
                <label for="amount" class="form-label">Cantidad</label>
                <input type="number" step="0.01" name="amount" id="amount"
                       class="form-control form-control-lg"
                       placeholder="Introduce cantidad" required>
            </div>

            <div class="row g-2 mb-3 align-items-center">
                <div class="col">
                    <select name="from_currency" class="form-select"
                            aria-label="Divisa de origen">
                        <option value="EUR">EUR €</option>
                        <option value="USD">USD $</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>

                <div class="col-auto text-center currency-arrow">
                    →
                </div>

                <div class="col">
                    <select name="to_currency" class="form-select"
                            aria-label="Divisa de destino">
                        <option value="USD">USD $</option>
                        <option value="EUR">EUR €</option>
                        <option value="GBP">GBP £</option>
                    </select>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    Convertir
                </button>
            </div>
        </form>

        {% if result is not none %}
            <div class="mt-4 text-center result-box">
                {{ result }}
            </div>
        {% endif %}
    </div>

</body>
</html>
